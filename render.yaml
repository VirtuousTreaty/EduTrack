services:
  - type: web
    name: edutrack-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: true
      - key: SEED_MODE
        value: demo
      - key: DEMO_SEED_VERSION
        value: friends-v1
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
